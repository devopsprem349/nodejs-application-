name: Build Test Docker

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t node-docker-app:latest .

      - name: Run Docker container
        run: |
          docker run -d \
            --name node-app \
            -p 3000:3000 \
            node-docker-app:latest

      - name: Check container
        run: docker ps

      - name: Test application
        run: |
          sleep 5
          curl --fail http://localhost:3000/health

      - name: Show Docker logs
        if: always()
        run: docker logs node-app

      - name: Stop container
        if: always()
        run: docker stop node-app || true
